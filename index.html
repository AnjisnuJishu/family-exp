<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dhar Household</title>

  <!-- iOS / Apple Home Screen Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dhar Household">

  <!-- Android / Chrome Theme Settings -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1e293b">

  <!-- Custom House + ₹ App Icon (Embedded SVG) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%230f766e'/%3E%3Cpath d='M256 95 L110 215 L150 215 L150 400 L362 400 L362 215 L402 215 Z' fill='%23134e4a'/%3E%3Cpath d='M256 120 L130 225 L165 225 L165 385 L347 385 L347 225 L382 225 Z' fill='none' stroke='white' stroke-width='18' stroke-linejoin='round'/%3E%3Ctext x='50%25' y='64%25' font-size='165' font-family='system-ui, sans-serif' font-weight='900' fill='white' dominant-baseline='middle' text-anchor='middle'%3E₹%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%230f766e'/%3E%3Cpath d='M256 95 L110 215 L150 215 L150 400 L362 400 L362 215 L402 215 Z' fill='%23134e4a'/%3E%3Cpath d='M256 120 L130 225 L165 225 L165 385 L347 385 L347 225 L382 225 Z' fill='none' stroke='white' stroke-width='18' stroke-linejoin='round'/%3E%3Ctext x='50%25' y='64%25' font-size='165' font-family='system-ui, sans-serif' font-weight='900' fill='white' dominant-baseline='middle' text-anchor='middle'%3E₹%3C/text%3E%3C/svg%3E">

  <!-- Standalone Manifest for Fullscreen App Launch -->
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Dhar%20Household%22%2C%22short_name%22%3A%22Dhar%20Household%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f8fafc%22%2C%22theme_color%22%3A%22%230f766e%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20512%20512'%253E%253Crect%20width%3D'512'%20height%3D'512'%20rx%3D'120'%20fill%3D'%25230f766e'%2F%253E%253Cpath%20d%3D'M256%2095%20L110%20215%20L150%20215%20L150%20400%20L362%20400%20L362%20215%20L402%20215%20Z'%20fill%3D'%2523134e4a'%2F%253E%253Cpath%20d%3D'M256%20120%20L130%20225%20L165%20225%20L165%20385%20L347%20385%20L347%20225%20L382%20225%20Z'%20fill%3D'none'%20stroke%3D'white'%20stroke-width%3D'18'%20stroke-linejoin%3D'round'%2F%253E%253Ctext%20x%3D'50%2525'%20y%3D'64%2525'%20font-size%3D'165'%20font-family%3D'system-ui%2C%20sans-serif'%20font-weight%3D'900'%20fill%3D'white'%20dominant-baseline%3D'middle'%20text-anchor%3D'middle'%253E%25E2%2582%25B9%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans pb-20">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-30 flex items-center justify-between">
    <div>
      <h1 class="text-base font-bold text-slate-900 leading-tight">Dhar Household</h1>
      <div id="syncStatus" class="text-[11px] text-emerald-600 font-medium flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Cloud Synced
      </div>
    </div>
    <div class="flex gap-1.5 bg-slate-100 p-1 rounded-xl" id="profileSelector">
      <button onclick="setProfile('Tamal')" class="profile-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition" data-name="Tamal">👨 Tamal</button>
      <button onclick="setProfile('Mousumi')" class="profile-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition" data-name="Mousumi">👩 Mousumi</button>
      <button onclick="setProfile('Jishu')" class="profile-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition" data-name="Jishu">👤 Jishu</button>
    </div>
  </header>

  <!-- Main Entry View -->
  <main id="entryView" class="p-4 max-w-md mx-auto w-full flex-1 flex flex-col gap-4">
    <!-- Big Amount Input -->
    <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm text-center">
      <label class="text-xs uppercase tracking-wider font-semibold text-slate-400 block mb-1">Enter Amount</label>
      <div class="flex items-center justify-center gap-1">
        <span class="text-3xl font-bold text-slate-400">₹</span>
        <input type="number" id="amountInput" placeholder="0" inputmode="decimal"
          class="text-4xl font-extrabold text-slate-900 w-44 text-center focus:outline-none placeholder-slate-300">
      </div>
    </div>

    <!-- Category Grid -->
    <div>
      <label class="text-xs uppercase tracking-wider font-semibold text-slate-400 block mb-2 px-1">Choose Category</label>
      <div class="grid grid-cols-3 gap-2" id="categoryGrid">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- Optional Detail Toggler -->
    <details class="bg-white border border-slate-200 rounded-xl overflow-hidden group">
      <summary class="px-4 py-2.5 text-xs font-semibold text-slate-500 flex justify-between items-center cursor-pointer list-none select-none">
        <span>+ More details (Subcategory, Payment, Note)</span>
        <span class="text-slate-400 text-sm group-open:rotate-180 transition">▾</span>
      </summary>
      <div class="p-3 pt-1 border-t border-slate-100 flex flex-col gap-2.5 text-xs">
        <div>
          <label class="text-slate-400 block mb-1 font-medium">Subcategory</label>
          <select id="subcatSelect" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 font-medium">
            <option value="">(Auto or select)</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-slate-400 block mb-1 font-medium">Payment Mode</label>
            <select id="paymentSelect" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 font-medium">
              <option value="UPI">UPI / GPay</option>
              <option value="Cash">Cash</option>
              <option value="Debit Card">Debit Card</option>
              <option value="Credit Card">Credit Card</option>
              <option value="Bank Transfer">Bank Transfer</option>
              <option value="Auto-debit">Auto-debit</option>
            </select>
          </div>
          <div>
            <label class="text-slate-400 block mb-1 font-medium">Merchant / Shop</label>
            <input type="text" id="merchantInput" placeholder="e.g. Local store" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 font-medium">
          </div>
        </div>
        <div>
          <label class="text-slate-400 block mb-1 font-medium">Note / Item description</label>
          <input type="text" id="noteInput" placeholder="e.g. Vegetables for the week" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 font-medium">
        </div>
      </div>
    </details>

    <!-- Save Button -->
    <button onclick="saveExpense()" id="saveBtn" class="w-full py-4 bg-emerald-600 active:bg-emerald-700 text-white font-bold text-base rounded-2xl shadow-md transition flex items-center justify-center gap-2 mt-auto">
      <span>Save Expense</span>
    </button>
  </main>

  <!-- Synced History View -->
  <main id="historyView" class="p-4 max-w-md mx-auto w-full flex-1 hidden flex-col gap-3">
    <div class="flex items-center justify-between">
      <h2 class="text-sm font-bold text-slate-800">Shared Live Log</h2>
      <button onclick="fetchSyncedExpenses()" class="text-xs text-blue-600 font-semibold flex items-center gap-1">
        ↻ Refresh
      </button>
    </div>
    <div id="historyList" class="flex flex-col gap-2 overflow-y-auto">
      <div class="text-center py-8 text-xs text-slate-400">Loading synced entries...</div>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 px-6 flex justify-around z-30 max-w-md mx-auto">
    <button onclick="switchTab('entry')" id="navEntry" class="flex flex-col items-center gap-0.5 text-emerald-600 font-bold text-[11px]">
      <span class="text-lg">➕</span>
      <span>Add Expense</span>
    </button>
    <button onclick="switchTab('history')" id="navHistory" class="flex flex-col items-center gap-0.5 text-slate-400 font-semibold text-[11px]">
      <span class="text-lg">📋</span>
      <span>Live History</span>
    </button>
  </nav>

  <script>
    // ---------------------------------------------------------------
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
    // ---------------------------------------------------------------
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxjbZW3DI-8GgdWzgmQMzULQFsfQ1QKbudEa4QENnNIAUvbvTuHPzDv1dhPZSNhZzmH/exec";

    const CATEGORIES = [
      { 
        name: "Groceries", 
        icon: "🛒", 
        type: "Essential", 
        need: "Need", 
        sub: ["Vegetables", "Fish", "Mutton/Chicken", "Milk & dairy", "Cosmetics & Toiletries"] 
      },
      { 
        name: "Domestic Help", 
        icon: "🧹", 
        type: "Essential", 
        need: "Need", 
        sub: ["Ashim", "Radha", "Moni", "Jharna", "Rahul Garden", "Dilip Da", "Paper"] 
      },
      { 
        name: "Utilities", 
        icon: "💡", 
        type: "Essential", 
        need: "Need", 
        sub: ["Electricity", "Gas / LPG", "Water"] 
      },
      { 
        name: "Mobile / Internet / Broadband", 
        icon: "📱", 
        type: "Essential", 
        need: "Need", 
        sub: ["Mobile recharge", "Broadband"] 
      },
      { 
        name: "Transport / Fuel", 
        icon: "⛽", 
        type: "Essential", 
        need: "Need", 
        sub: ["Fuel", "Train / Auto / Taxi / Bus"] 
      },
      { 
        name: "Medical / Pharmacy", 
        icon: "💊", 
        type: "Essential", 
        need: "Need", 
        sub: ["Medicines", "Doctor / Tests"] 
      },
      { 
        name: "Dining / Takeaway", 
        icon: "🍽️", 
        type: "Discretionary", 
        need: "Want", 
        sub: ["Restaurant", "Food delivery"] 
      },
      { 
        name: "Shopping", 
        icon: "🛍️", 
        type: "Discretionary", 
        need: "Want", 
        sub: ["Clothes", "Electronics"] 
      },
      { 
        name: "Subscriptions", 
        icon: "📺", 
        type: "Discretionary", 
        need: "Want", 
        sub: ["OTT / Streaming"] 
      },
      { 
        name: "Home Maintenance", 
        icon: "🔧", 
        type: "Essential", 
        need: "Need", 
        sub: ["Repairs / Maintainance"] 
      },
      { 
        name: "Education", 
        icon: "📚", 
        type: "Essential", 
        need: "Need", 
        sub: ["School / College fees", "Tuition"] 
      },
      { 
        name: "Insurance", 
        icon: "🛡️", 
        type: "Essential", 
        need: "Need", 
        sub: ["Insurance premium"] 
      },
      { 
        name: "Gifts / Donations", 
        icon: "🎁", 
        type: "Personal / Misc", 
        need: "Want", 
        sub: ["Gift", "Donation"] 
      },
      { 
        name: "Fees / Charges", 
        icon: "🏦", 
        type: "Personal / Misc", 
        need: "Could Avoid", 
        sub: ["Bank charges"] 
      },
      { 
        name: "Other", 
        icon: "📦", 
        type: "Personal / Misc", 
        need: "Could Avoid", 
        sub: ["Other"] 
      }
    ];

    let currentProfile = localStorage.getItem("active_profile") || "Tamal";
    let selectedCategory = CATEGORIES[0];

    function init() {
      renderProfiles();
      renderCategories();
      updateSubcategories();
    }

    function setProfile(name) {
      currentProfile = name;
      localStorage.setItem("active_profile", name);
      renderProfiles();
    }

    function renderProfiles() {
      document.querySelectorAll(".profile-btn").forEach(btn => {
        const isActive = btn.getAttribute("data-name") === currentProfile;
        btn.className = `profile-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition ${
          isActive ? 'bg-white shadow text-slate-900 border border-slate-200' : 'text-slate-500 hover:text-slate-800'
        }`;
      });
    }

    function renderCategories() {
      const grid = document.getElementById("categoryGrid");
      grid.innerHTML = CATEGORIES.map((cat, idx) => `
        <button onclick="selectCategory(${idx})" id="cat-${idx}" class="cat-card p-3 rounded-xl border flex flex-col items-center justify-center text-center transition ${
          selectedCategory.name === cat.name ? 'border-emerald-500 bg-emerald-50 text-emerald-900 shadow-sm' : 'border-slate-200 bg-white text-slate-700'
        }">
          <span class="text-2xl mb-1">${cat.icon}</span>
          <span class="text-[11px] font-semibold leading-tight">${cat.name}</span>
        </button>
      `).join('');
    }

    function selectCategory(index) {
      selectedCategory = CATEGORIES[index];
      renderCategories();
      updateSubcategories();
    }

    function updateSubcategories() {
      const sel = document.getElementById("subcatSelect");
      sel.innerHTML = `<option value="">(Default: ${selectedCategory.sub[0] || selectedCategory.name})</option>` +
        selectedCategory.sub.map(s => `<option value="${s}">${s}</option>`).join('');
    }

    async function saveExpense() {
      const amountVal = document.getElementById("amountInput").value;
      if (!amountVal || parseFloat(amountVal) <= 0) {
        alert("Please enter an amount.");
        return;
      }

      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;
      saveBtn.innerText = "Saving to Google Sheets...";

      const subcatInput = document.getElementById("subcatSelect").value;
      const subcategory = subcatInput || (selectedCategory.sub[0] || selectedCategory.name);
      const today = new Date().toISOString().split('T')[0];

      const record = {
        date: today,
        description: document.getElementById("noteInput").value.trim() || selectedCategory.name,
        category: selectedCategory.name,
        subcategory: subcategory,
        amount: parseFloat(amountVal),
        paidBy: currentProfile,
        paymentMethod: document.getElementById("paymentSelect").value,
        needWant: selectedCategory.need,
        essentialDiscretionary: selectedCategory.type,
        recurring: "No",
        merchant: document.getElementById("merchantInput").value.trim(),
        notes: document.getElementById("noteInput").value.trim()
      };

      // 1. Send silently to Google Sheets Apps Script
      if (SCRIPT_URL && SCRIPT_URL !== "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") {
        try {
          await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(record)
          });
        } catch (err) {
          console.error("Cloud sync failed, logged locally", err);
        }
      }

      // 2. Also keep a local cache
      let localLogs = JSON.parse(localStorage.getItem("offline_logs") || "[]");
      localLogs.unshift(record);
      localStorage.setItem("offline_logs", JSON.stringify(localLogs));

      // Reset Form
      document.getElementById("amountInput").value = "";
      document.getElementById("merchantInput").value = "";
      document.getElementById("noteInput").value = "";
      saveBtn.disabled = false;
      saveBtn.innerText = "Saved ✓";
      setTimeout(() => { saveBtn.innerText = "Save Expense"; }, 1500);
    }

    async function fetchSyncedExpenses() {
      const list = document.getElementById("historyList");
      list.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">Fetching shared entries...</div>`;

      if (!SCRIPT_URL || SCRIPT_URL === "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") {
        renderLocalExpenses();
        return;
      }

      try {
        // Adding ?_nocache= prevents the phone browser from serving stale cached responses
        const cacheBuster = SCRIPT_URL + (SCRIPT_URL.includes('?') ? '&' : '?') + '_nocache=' + Date.now();
        const res = await fetch(cacheBuster, { cache: "no-store" });
        const json = await res.json();
        
        if (json.status === "success") {
          // If sheet is empty or only headers exist
          if (!json.data || json.data.length === 0) {
            localStorage.removeItem("offline_logs"); // Wipe local backup cache
            renderList([]);
          } else {
            renderList(json.data);
          }
        } else {
          renderLocalExpenses();
        }
      } catch (e) {
        console.error("Fetch error:", e);
        renderLocalExpenses();
      }
    }

    function renderLocalExpenses() {
      const localLogs = JSON.parse(localStorage.getItem("offline_logs") || "[]");
      renderList(localLogs);
    }

    function renderList(records) {
      const list = document.getElementById("historyList");
      if (records.length === 0) {
        list.innerHTML = `<div class="text-center py-8 text-xs text-slate-400">No transactions recorded yet.</div>`;
        return;
      }
      list.innerHTML = records.map(r => `
        <div class="bg-white p-3 rounded-xl border border-slate-200 flex justify-between items-center shadow-sm">
          <div>
            <div class="text-xs font-bold text-slate-800">${r.category} <span class="font-normal text-slate-400">• ${r.subcategory}</span></div>
            <div class="text-[10px] text-slate-500 font-medium">${r.date} • Paid by <b class="text-slate-700">${r.paidBy}</b></div>
          </div>
          <div class="text-sm font-extrabold text-slate-900">₹${Number(r.amount).toLocaleString('en-IN')}</div>
        </div>
      `).join('');
    }

    function switchTab(tab) {
      if (tab === 'entry') {
        document.getElementById('entryView').classList.remove('hidden');
        document.getElementById('historyView').classList.add('hidden');
        document.getElementById('navEntry').className = "flex flex-col items-center gap-0.5 text-emerald-600 font-bold text-[11px]";
        document.getElementById('navHistory').className = "flex flex-col items-center gap-0.5 text-slate-400 font-semibold text-[11px]";
      } else {
        document.getElementById('entryView').classList.add('hidden');
        document.getElementById('historyView').classList.remove('hidden');
        document.getElementById('navEntry').className = "flex flex-col items-center gap-0.5 text-slate-400 font-semibold text-[11px]";
        document.getElementById('navHistory').className = "flex flex-col items-center gap-0.5 text-emerald-600 font-bold text-[11px]";
        fetchSyncedExpenses();
      }
    }

    init();
  </script>
</body>
</html>
